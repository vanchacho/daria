<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daria Bucinashvili — Model Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#111111; --muted:#777777; --line:#d9d9d9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* ---------- Header (Natali style) ---------- */
  header{max-width:1100px;margin:0 auto;padding:28px 16px 10px;display:flex;justify-content:center;align-items:center;gap:28px}
  .logo{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(56px,13vw,150px);line-height:.85;letter-spacing:.02em;text-transform:uppercase}
  nav{border-left:1px solid var(--ink);padding-left:12px;display:flex;flex-direction:column;gap:8px}
  nav a{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  nav a:hover{text-decoration:underline}

  /* ---------- Profile ---------- */
  .profile{max-width:1100px;margin:0 auto;padding:24px 16px 0;text-align:center}
  .name{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:30px;margin-bottom:22px}
  .stats{display:flex;justify-content:center;flex-wrap:wrap;gap:0;margin-bottom:34px}
  .stat{padding:4px 18px;border-right:1px solid var(--line);min-width:72px}
  .stat:last-child{border-right:none}
  .stat dt{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:15px}
  .stat dd{font-size:10px;letter-spacing:.1em;color:var(--muted);margin-top:4px;text-transform:uppercase}

  /* ---------- Slider ---------- */
  .slider{position:relative;width:min(420px,100%);margin:0 auto;aspect-ratio:2/3;background:#f2f2f2;overflow:hidden}
  .slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease;cursor:zoom-in}
  .slider img.active{opacity:1}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;background:rgba(255,255,255,.75);font-size:22px;cursor:pointer;z-index:2;font-family:"Cormorant Garamond",serif}
  .arrow:hover{background:#fff}
  .prev{left:0}.next{right:0}
  .counter{font-size:11px;letter-spacing:.15em;color:var(--muted);margin:12px 0 0}

  /* ---------- Book grid ---------- */
  .book{max-width:1100px;margin:60px auto 0;padding:0 16px}
  .book h2{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:24px;text-align:center;margin-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
  .grid figure{aspect-ratio:2/3;overflow:hidden;background:#f2f2f2;cursor:zoom-in}
  .grid img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease, filter .5s ease}
  .grid figure:hover img{transform:scale(1.04);filter:brightness(.92)}

  /* ---------- Contact / footer ---------- */
  .contact{max-width:600px;margin:70px auto 0;padding:0 16px;text-align:center}
  .contact h2{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:24px;margin-bottom:14px}
  .contact p{font-size:13px;line-height:1.9;color:#333}
  footer{margin-top:70px;padding:24px 16px;border-top:1px solid var(--line);text-align:center;font-size:11px;letter-spacing:.08em;color:var(--muted)}
  footer .follow{margin-bottom:8px;color:var(--ink)}
  .contact a, footer a{border-bottom:1px solid currentColor}

  /* ---------- Lightbox ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(255,255,255,.97);display:none;align-items:center;justify-content:center;z-index:50}
  .lightbox.open{display:flex}
  .lightbox img{max-width:92vw;max-height:90vh;object-fit:contain}
  .lightbox .close{position:absolute;top:14px;right:20px;font-size:34px;background:none;border:none;cursor:pointer;font-family:"Cormorant Garamond",serif}
  .lightbox .arrow{background:transparent}

  @media (max-width:600px){
    header{flex-direction:column;gap:14px;padding:24px 16px 6px}
    .logo{font-size:clamp(64px,22vw,96px)}
    nav{flex-direction:row;justify-content:center;gap:0;border-left:none;padding-left:0;border-top:1px solid var(--ink);padding-top:10px;width:100%}
    nav a{font-size:10px;padding:4px 10px;border-right:1px solid var(--line)}
    nav a:last-child{border-right:none}
    .profile{padding-top:18px}
    .name{font-size:26px;margin-bottom:18px}
    .stats{row-gap:14px;margin-bottom:24px}
    .stat{flex:0 0 25%;padding:2px 4px;min-width:0}
    .stat:nth-child(4n){border-right:none}
    .stat dt{font-size:14px}
    .stat dd{font-size:9px}
    .slider{width:100%}
    .arrow{width:36px;height:36px;font-size:20px}
    .book{margin-top:44px}
    .grid{grid-template-columns:repeat(2,1fr);gap:8px}
    .contact{margin-top:50px}
    .contact p{font-size:14px;line-height:2.1}
    footer{margin-top:50px}
    .lightbox .arrow{display:none}
    .lightbox img{max-width:100vw;max-height:85vh}
  }
</style>
</head>
<body>

<header>
  <!-- აქ ჩაწერე სახელი -->
  <a href="#" class="logo">Daria</a>
  <nav>
    <a href="#">Home</a>
    <a href="#book">Book</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="profile" id="about">
  <!-- სახელი და გვარის პირველი ასო -->
  <h1 class="name">Daria Bucinashvili</h1>

  <!-- პარამეტრები — შეცვალე შენი მონაცემებით -->
  <dl class="stats">
    <div class="stat"><dt>Height</dt><dd>175</dd></div>
    <div class="stat"><dt>Bust</dt><dd>86</dd></div>
    <div class="stat"><dt>Waist</dt><dd>62</dd></div>
    <div class="stat"><dt>Hips</dt><dd>90</dd></div>
    <div class="stat"><dt>Hair</dt><dd>Blonde</dd></div>
    <div class="stat"><dt>Eyes</dt><dd>Brown</dd></div>
    <div class="stat"><dt>Shoe</dt><dd>38</dd></div>
  </dl>

  <div class="slider" id="slider">
    <button class="arrow prev" aria-label="Previous">&#8249;</button>
    <button class="arrow next" aria-label="Next">&#8250;</button>
  </div>
  <p class="counter" id="counter"></p>
</section>

<section class="book" id="book">
  <h2>Portfolio</h2>
  <div class="grid" id="grid"></div>
</section>

<section class="contact" id="contact">
  <h2>Contact</h2>
  <!-- საკონტაქტო ინფორმაცია -->
  <p>Email: <a href="mailto:daria.bucinashvili96@gmail.com">daria.bucinashvili96@gmail.com</a><br>Phone: <a href="tel:+995595913109">+995 595 913 109</a><br>Instagram: <a href="https://www.instagram.com/daria_bucinashvili/" target="_blank" rel="noopener">@daria_bucinashvili</a></p>
</section>

<footer>
  <div class="follow">FOLLOW ME: <a href="https://www.instagram.com/daria_bucinashvili/" target="_blank" rel="noopener">INSTAGRAM</a></div>
  © <span id="year"></span> Daria Bucinashvili. All Rights Reserved
</footer>

<div class="lightbox" id="lightbox">
  <button class="close" aria-label="Close">&times;</button>
  <button class="arrow prev" aria-label="Previous">&#8249;</button>
  <img alt="">
  <button class="arrow next" aria-label="Next">&#8250;</button>
</div>

<script>
  // ფოტოები — ახალი ფოტოს დასამატებლად უბრალოდ ჩაამატე ფაილის სახელი
  const photos = [
    "IMG_4354.JPEG",
    "IMG_2011.JPG.jpeg",
    "IMG_4344.JPEG",
    "IMG_2847.JPEG",
    "IMG_2672.JPEG",
    "IMG_4343.JPEG",
    "IMG_4327.JPEG"
  ];

  const slider = document.getElementById("slider");
  const counter = document.getElementById("counter");
  const grid = document.getElementById("grid");
  const lb = document.getElementById("lightbox");
  const lbImg = lb.querySelector("img");
  let current = 0, lbIndex = 0, timer;

  photos.forEach((src, i) => {
    const img = document.createElement("img");
    img.src = src; img.alt = "Portfolio photo " + (i + 1);
    if (i === 0) img.classList.add("active");
    img.addEventListener("click", () => openLb(i));
    slider.appendChild(img);

    const fig = document.createElement("figure");
    const t = document.createElement("img");
    t.src = src; t.alt = img.alt; t.loading = "lazy";
    fig.appendChild(t);
    fig.addEventListener("click", () => openLb(i));
    grid.appendChild(fig);
  });

  const slides = slider.querySelectorAll("img");
  function show(n){
    slides[current].classList.remove("active");
    current = (n + photos.length) % photos.length;
    slides[current].classList.add("active");
    counter.textContent = (current + 1) + " / " + photos.length;
  }
  function auto(){ clearInterval(timer); timer = setInterval(() => show(current + 1), 4500); }
  slider.querySelector(".prev").onclick = () => { show(current - 1); auto(); };
  slider.querySelector(".next").onclick = () => { show(current + 1); auto(); };
  show(0); auto();

  function openLb(i){ lbIndex = i; lbImg.src = photos[i]; lb.classList.add("open"); clearInterval(timer); }
  function closeLb(){ lb.classList.remove("open"); auto(); }
  function stepLb(d){ lbIndex = (lbIndex + d + photos.length) % photos.length; lbImg.src = photos[lbIndex]; }
  lb.querySelector(".close").onclick = closeLb;
  lb.querySelector(".prev").onclick = e => { e.stopPropagation(); stepLb(-1); };
  lb.querySelector(".next").onclick = e => { e.stopPropagation(); stepLb(1); };
  lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closeLb();
    if (e.key === "ArrowLeft") stepLb(-1);
    if (e.key === "ArrowRight") stepLb(1);
  });

  // ტელეფონზე თითით გადაფურცვლა
  function swipe(el, onLeft, onRight){
    let x0 = null;
    el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
    el.addEventListener("touchend", e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) (dx < 0 ? onLeft : onRight)();
    });
  }
  swipe(slider, () => { show(current + 1); auto(); }, () => { show(current - 1); auto(); });
  swipe(lb, () => stepLb(1), () => stepLb(-1));

  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
